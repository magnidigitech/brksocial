<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#18181b" />
    <meta name="description" content="BRK TaskHub - Centralized Employee Task & Verification Platform" />
    
    <!-- Cache Busting Meta Headers -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <!-- PWA Manifest & iOS Meta Tags -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BRK TaskHub" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Open Graph & Social Preview Meta Tags (WhatsApp, Facebook, Telegram) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Follow Sri Bhashyam Ramakrishna on Instagram" />
    <meta property="og:description" content="Official citizen outreach and social media initiative for Sri Bhashyam Ramakrishna." />
    <meta property="og:image" content="/images/KutamiLOGO.jpg" />
    <meta property="og:image:width" content="600" />
    <meta property="og:image:height" content="600" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sri Bhashyam Ramakrishna Official Citizen Outreach" />
    <meta name="twitter:description" content="Connect with Sri Bhashyam Ramakrishna on Instagram." />
    <meta name="twitter:image" content="/images/KutamiLOGO.jpg" />

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <title>BRK TaskHub | Employee Task System</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- PWA Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => {
              console.log('BRK TaskHub PWA SW registered:', reg.scope);
              if (reg.update) reg.update();
            })
            .catch(err => console.warn('PWA SW registration error:', err));
        });
      }
    </script>
  </body>
</html>
